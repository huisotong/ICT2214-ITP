name: App Test Cases

on:
  push:
    branches: [ main, dev, Owen ]
  pull_request:

jobs:
  # -------------------------
  # Backend: Pytest (Flask)
  # -------------------------
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # If you already had a Python setup step in the original file, keep it.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # adjust if your backend needs a different version
          cache: 'pip'

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          FLASK_ENV: testing
        run: pytest --maxfail=3 --disable-warnings -q

  # -------------------------
  # Frontend: Jest (React/Vite)
  # -------------------------
  jest:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Uncomment if you have a lint script
      # - name: Lint
      #   run: npm run lint

      - name: Run Jest tests (CI mode + coverage)
        env:
          CI: true
        run: npm test -- --ci --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
